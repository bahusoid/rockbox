# .cfg file created by rockbox 1fac57ece4M-260805 - http://www.rockbox.org

# Enable audiobook specific setting
alt settings enable: on
alt settings paths: /ABooks:/Audiobooks
alt autocreate bookmarks: on
alt reset pitch: on
alt skip length: 30

# Add Audiobook Skip Length option to quickscreen
qs top: alt skip length
qs bottom: alt skip length

rewind across tracks: on

# File browser follows the currently playing track’s location
follow playlist: on

autocreate bookmarks: recent only - on
use most-recent-bookmarks: unique only

pause on headphone unplug: pause
disable autoresume if phones not present: on

cuesheet support: on

# Default sleep timer duration (minutes)
sleeptimer duration: 45
# Auto‑enable sleep timer at startup
sleeptimer on startup: on
# Any keypress restarts the sleep countdown
keypress restarts sleeptimer: on

# Add Speed option to Pitchscreen (ability to change speed without affecting pitch)
timestretch enabled: on
# Make speed option visible by default on Pitchscreen
Timestretch mode: on

# Allow playback buttons to work when locked
No Screen Lock For Selected Actions: on
Selective Screen Lock Actions: 559

# Disable backlight for button presses
No Backlight On Selected Actions: on
Selective Backlight Actions: 15

# Lock switches off backlight immediately
backlight on button hold: off

# Show battery as a numeric percentage
battery display: numeric